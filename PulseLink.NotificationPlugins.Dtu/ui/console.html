<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>DTU 网关控制台</title>
  <script src="bridge.js"></script>
  <style>
    :root{color:#1d2939;font:14px/1.5 Inter,"Microsoft YaHei",system-ui,sans-serif}*{box-sizing:border-box}body{margin:0;background:#f8fafc}.page{max-width:1280px;margin:auto;padding:20px 24px}.hero{display:flex;justify-content:space-between;gap:18px;align-items:flex-start;margin-bottom:16px}.eyebrow{color:#1677ff;font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase}.hero h1{margin:4px 0;font-size:26px}.hero p{margin:0;color:#667085}.status{min-width:154px;padding:12px 14px;border:1px solid #d0d5dd;border-radius:10px;background:#fff}.status b{display:block;font-size:18px}.status span{color:#667085;font-size:12px}.grid{display:grid;grid-template-columns:1.2fr .8fr;gap:18px}.card{background:#fff;border:1px solid #eaecf0;border-radius:12px;padding:16px;box-shadow:0 1px 2px #1018280d}.card h2{margin:0 0 12px;font-size:16px}.fields{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.gateway-fields{grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.wide{grid-column:span 2}label{display:grid;gap:6px;color:#344054;font-weight:600;font-size:13px}input,select,textarea{width:100%;padding:9px 10px;color:#101828;background:#fff;border:1px solid #d0d5dd;border-radius:7px;font:inherit;outline:none}input:focus,select:focus,textarea:focus{border-color:#84adff;box-shadow:0 0 0 3px #1677ff1a}textarea{min-height:108px;resize:vertical}.check{display:flex;align-items:center;gap:8px;padding-top:25px}.check input{width:16px;height:16px}.gateway-fields .check{padding-top:25px}.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}button{border:1px solid #d0d5dd;background:#fff;color:#344054;border-radius:7px;padding:8px 12px;font:inherit;font-weight:600;cursor:pointer}button:hover{background:#f9fafb}button.primary{background:#1677ff;border-color:#1677ff;color:#fff}button.primary:hover{background:#0958d9}button.danger{border-color:#fda29b;color:#b42318}.runtime{grid-column:span 2}.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:16px}.metric{background:#f8fafc;border:1px solid #eaecf0;border-radius:8px;padding:10px}.metric span{display:block;color:#667085;font-size:12px}.metric b{font-size:20px}.runtime-grid{display:grid;grid-template-columns:1fr;gap:14px}.runtime-section{min-width:0;border:1px solid #eaecf0;border-radius:10px;overflow:hidden}.section-heading{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 14px;background:#f8fafc;border-bottom:1px solid #eaecf0}.section-heading h3{margin:0;font-size:14px}.heading-actions{display:flex;gap:8px;align-items:center}.heading-actions button{padding:4px 8px;font-size:12px}.count{padding:1px 8px;border-radius:999px;background:#eaf2ff;color:#175cd3;font-size:12px;font-weight:700}.empty{padding:28px 16px;color:#667085;text-align:center}.device-list{max-height:220px;overflow:auto}.device{padding:12px 14px;border-bottom:1px solid #f0f2f5}.device:last-child{border-bottom:0}.device-top{display:flex;align-items:center;justify-content:space-between;gap:8px;font-weight:700;color:#101828}.device-id{margin-top:2px;color:#667085;font:12px ui-monospace,Consolas,monospace}.device-meta{display:grid;grid-template-columns:1fr 1fr;gap:5px 12px;margin-top:9px;color:#667085;font-size:12px}.device-meta b{display:block;color:#344054;font-weight:600}.pill{flex:none;padding:2px 7px;border-radius:999px;background:#ecfdf3;color:#027a48;font-size:12px;font-weight:700}.pill.busy{background:#fff4e5;color:#b54708}.pill.unknown{background:#fff4e5;color:#b54708}.pill.failed{background:#fef3f2;color:#b42318}.log-list,.task-list{max-height:320px;overflow:auto}.log{display:grid;grid-template-columns:auto 1fr;gap:9px;padding:10px 14px;border-bottom:1px solid #f0f2f5}.log:last-child,.task:last-child{border-bottom:0}.log-time{padding-top:2px;color:#667085;font:12px ui-monospace,Consolas,monospace;white-space:nowrap}.log-body{min-width:0}.event{display:inline-block;margin-right:7px;padding:1px 6px;border-radius:4px;background:#eef4ff;color:#175cd3;font-size:11px;font-weight:700}.event.message{background:#f4f3ff;color:#6938ef}.event.error{background:#fef3f2;color:#b42318}.log-message{display:inline;color:#344054;overflow-wrap:anywhere}.task{display:grid;grid-template-columns:1.4fr auto auto;align-items:center;gap:12px;padding:10px 14px;border-bottom:1px solid #f0f2f5}.task-title{font-weight:700}.task-meta{margin-top:2px;color:#667085;font-size:12px}.task button{padding:4px 8px;font-size:12px}.task-state{font-size:12px;font-weight:700;color:#027a48}.task-state.queued,.task-state.dispatching,.task-state.dispatched{color:#175cd3}.task-state.unknown{color:#b54708}.task-state.failed,.task-state.cancelled{color:#b42318}details{margin-top:14px}summary{cursor:pointer;color:#667085;font-size:12px}pre{margin:8px 0 0;max-height:210px;overflow:auto;border-radius:8px;padding:13px;background:#101828;color:#e4e7ec;font:12px/1.55 ui-monospace,Consolas,monospace}@media(max-width:760px){.page{padding:14px}.hero,.grid{display:block}.status{margin-top:14px}.card{margin-bottom:14px}.fields,.gateway-fields{grid-template-columns:1fr}.wide,.runtime{grid-column:span 1}.metrics{grid-template-columns:repeat(2,1fr)}.device-meta{grid-template-columns:1fr}.log{grid-template-columns:1fr;gap:2px}.task{grid-template-columns:1fr;gap:4px}}
  </style>
</head>
<body>
<main class="page">
  <header class="hero"><div><div class="eyebrow">PulseLink Service Plugin</div><h1>DTU SMS / 语音网关</h1><p>管理设备连接、投递确认与测试通知。</p></div><div class="status"><span>网关状态</span><b id="state">加载中</b><span id="portSummary">—</span></div></header>
  <section class="grid">
    <article class="card"><h2>网关配置</h2><div class="fields gateway-fields">
      <label class="check"><input id="enabled" type="checkbox" checked>启用 TCP 监听</label><label>监听端口<input id="port" type="number" min="1" max="65535" value="8000"></label>
      <label>心跳内容<input id="heartbeat" value="Heartbeat"></label><label>心跳超时（秒）<input id="heartbeatTimeout" type="number" min="10" value="60"></label>
      <label>发送超时（秒）<input id="sendTimeout" type="number" min="5" value="25"></label><label>单设备任务间隔（毫秒）<input id="interval" type="number" min="1000" value="1200"></label>
      <label>任务队列容量<input id="capacity" type="number" min="1" value="1000"></label><label>短信签名<input id="signature" placeholder="例如：[PulseLink]"></label>
    </div><div class="actions"><button class="primary" onclick="applyConfig()">保存并应用</button><button onclick="restart()">重启监听</button><button class="danger" onclick="stopGateway()">停止网关</button></div></article>
    <article class="card"><h2>发送测试</h2><div class="fields"><label>通知类型<select id="kind"><option value="0">短信</option><option value="1">语音呼叫</option></select></label><label>手机号码<input id="phone" placeholder="13800138000"></label><label class="wide">通知内容<textarea id="message">PulseLink DTU 测试通知</textarea></label></div><div class="actions"><button class="primary" onclick="sendTest()">发送测试</button><button onclick="refresh()">刷新状态</button></div></article>
    <article class="card runtime"><h2>运行状态</h2><div class="metrics"><div class="metric"><span>在线设备</span><b id="clientCount">—</b></div><div class="metric"><span>等待任务</span><b id="pendingCount">—</b></div><div class="metric"><span>监听端口</span><b id="runtimePort">—</b></div><div class="metric"><span>最近事件</span><b id="logCount">—</b></div></div>
      <div class="runtime-grid"><section class="runtime-section"><div class="section-heading"><h3>已连接设备</h3><span id="clientBadge" class="count">0 台</span></div><div id="deviceList" class="device-list"></div></section><section class="runtime-section"><div class="section-heading"><h3>网关事件日志</h3><span class="count">最近 100 条</span></div><div id="logList" class="log-list"></div></section><section class="runtime-section"><div class="section-heading"><h3>投递任务</h3><div class="heading-actions"><button onclick="refreshTasks()">刷新</button><button onclick="clearFinishedTasks()">清理已完成</button></div></div><div id="taskList" class="task-list"></div></section></div>
      <details><summary>查看原始诊断数据</summary><pre id="output">加载 DTU 网关数据…</pre></details>
    </article>
  </section>
</main>
<script>
  const $=id=>document.getElementById(id),value=(o,a,b)=>o?.[a]??o?.[b],number=id=>Number($(id).value);
  const config=()=>({enableTcpServer:$('enabled').checked,port:number('port'),heartbeat:$('heartbeat').value,heartbeatTimeoutSeconds:number('heartbeatTimeout'),sendTimeoutSeconds:number('sendTimeout'),taskIntervalMilliseconds:number('interval'),queueCapacity:number('capacity'),smsSignature:$('signature').value});
  const show=data=>$('output').textContent=JSON.stringify(data,null,2);
  const formatTime=value=>{const date=new Date(value);return Number.isNaN(date.getTime())?'—':date.toLocaleString('zh-CN',{hour12:false})};
  const eventLabel={listener_started:'监听启动',device_connected:'设备上线',device_disconnected:'设备离线',device_message:'设备上报',task_delivered:'投递成功',task_rejected:'投递失败'};
  function textCell(tag,text,className){const node=document.createElement(tag);if(className)node.className=className;node.textContent=text;return node}
  function renderDevices(clients){const list=$('deviceList');list.replaceChildren();if(!clients.length){list.append(textCell('div','暂无 DTU 设备连接。','empty'));return}clients.forEach(client=>{const endpoint=value(client,'EndPoint','endPoint')??'未知地址',id=value(client,'Id','id')??'—',busy=Boolean(value(client,'IsBusy','isBusy'));const row=document.createElement('div');row.className='device';const top=document.createElement('div');top.className='device-top';top.append(textCell('span',endpoint),textCell('span',busy?'任务处理中':'空闲',`pill${busy?' busy':''}`));const deviceId=textCell('div',`会话 ${String(id).slice(0,12)}`,'device-id');const meta=document.createElement('div');meta.className='device-meta';const connected=textCell('div','连接时间');connected.append(textCell('b',formatTime(value(client,'ConnectedAt','connectedAt'))));const seen=textCell('div','最后活动');seen.append(textCell('b',formatTime(value(client,'LastSeen','lastSeen'))));meta.append(connected,seen);row.append(top,deviceId,meta);list.append(row)})}
  function renderLogs(logs){const list=$('logList');list.replaceChildren();if(!logs.length){list.append(textCell('div','暂无网关事件。','empty'));return}[...logs].reverse().forEach(log=>{const event=value(log,'Event','event')??'event',row=document.createElement('div');row.className='log';const time=textCell('time',formatTime(value(log,'Timestamp','timestamp')),'log-time');const body=document.createElement('div');body.className='log-body';const tag=textCell('span',eventLabel[event]??event,'event');if(event==='device_message')tag.classList.add('message');if(event==='task_rejected')tag.classList.add('error');body.append(tag,textCell('span',value(log,'Message','message')??'—','log-message'));row.append(time,body);list.append(row)})}
  function renderTasks(tasks){const list=$('taskList');list.replaceChildren();if(!tasks.length){list.append(textCell('div','暂无投递任务。','empty'));return}tasks.forEach(task=>{const state=String(value(task,'State','state')??'Unknown'),row=document.createElement('div');row.className='task';const main=document.createElement('div');const kind=value(task,'Kind','kind')??'DTU',phone=value(task,'Phone','phone')??'—',device=value(task,'Device','device');main.append(textCell('div',`${kind} · ${phone}`,'task-title'),textCell('div',`${formatTime(value(task,'CreatedAt','createdAt'))}${device?` · ${device}`:''}${value(task,'Summary','summary')?` · ${value(task,'Summary','summary')}`:''}`,'task-meta'));const status=textCell('span',state,'task-state '+state.toLowerCase());row.append(main,status);if(state==='Queued'){const cancel=document.createElement('button');cancel.textContent='取消';cancel.onclick=()=>cancelTask(value(task,'Id','id'));row.append(cancel)}list.append(row)})}
  async function call(operation,payload={}){try{const result=await window.PulseLinkPlugin.call(operation,payload);show(result);return result}catch(error){show({error:error.message});throw error}}
  function fill(c){$('enabled').checked=!!value(c,'EnableTcpServer','enableTcpServer');$('port').value=value(c,'Port','port')??8000;$('heartbeat').value=value(c,'Heartbeat','heartbeat')??'Heartbeat';$('heartbeatTimeout').value=value(c,'HeartbeatTimeoutSeconds','heartbeatTimeoutSeconds')??60;$('sendTimeout').value=value(c,'SendTimeoutSeconds','sendTimeoutSeconds')??25;$('interval').value=value(c,'TaskIntervalMilliseconds','taskIntervalMilliseconds')??1200;$('capacity').value=value(c,'QueueCapacity','queueCapacity')??1000;$('signature').value=value(c,'SmsSignature','smsSignature')??''}
  function status(s){const running=value(s,'IsRunning','isRunning'),port=value(s,'Port','port'),clients=value(s,'Clients','clients')??[],pending=value(s,'PendingCount','pendingCount')??0,logs=value(s,'Logs','logs')??[];$('state').textContent=running?'运行中':'已停止';$('portSummary').textContent=running?`TCP ${port}`:'未监听';$('clientCount').textContent=clients.length;$('clientBadge').textContent=`${clients.length} 台`;$('pendingCount').textContent=pending;$('runtimePort').textContent=port??'—';$('logCount').textContent=logs.length;renderDevices(clients);renderLogs(logs)}
  async function refreshTasks(){renderTasks(await call('get-tasks',{limit:100}))}async function cancelTask(taskId){await call('cancel-task',{taskId});await refreshTasks()}async function clearFinishedTasks(){await call('clear-finished-tasks');await refreshTasks()}async function refresh(){const s=await call('get-status');status(s);await refreshTasks();return s}async function applyConfig(){status(await call('apply-configuration',config()));await refreshTasks()}async function restart(){status(await call('restart'));await refreshTasks()}async function stopGateway(){status(await call('stop'));await refreshTasks()}async function sendTest(){status(await call('send-test',{kind:number('kind'),phone:$('phone').value,message:$('message').value}));await refreshTasks()}
  window.PulseLinkPlugin.call('get-configuration').then(fill).then(refresh).catch(error=>show({error:error.message}));setInterval(()=>{if(!document.hidden)refresh()},10000);
</script>
</body>
</html>
